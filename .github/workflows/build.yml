name: Build Cross-Platform

on:
  push:
    branches: [ main, master, 'develop/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================
  # Build the native library (VST3 SDK + AudioToolbox, no JUCE)
  # for every target platform. Where the runner can execute the
  # result, also run the native unit tests and the C# API tests
  # against the VST3 SDK sample plugins.
  # ============================================================
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            rid: win-x64
            lib_name: ownvst3.dll
            cmake_args: -A x64
            native_tests: true
            api_tests: true

          # Windows x86
          - os: windows-latest
            rid: win-x86
            lib_name: ownvst3.dll
            cmake_args: -A Win32
            native_tests: true
            api_tests: false

          # Windows ARM64
          - os: windows-latest
            rid: win-arm64
            lib_name: ownvst3.dll
            cmake_args: -A ARM64
            native_tests: false
            api_tests: false

          # macOS Universal (x86_64 + arm64 fat binary)
          - os: macos-latest
            rid: osx-universal
            lib_name: libownvst3.dylib
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            native_tests: true
            api_tests: true

          # Linux x64
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: libownvst3.so
            cmake_args: ""
            native_tests: true
            api_tests: true

          # Linux ARM64 (cross-compile from x64 runner)
          - os: ubuntu-latest
            rid: linux-arm64
            lib_name: libownvst3.so
            native_tests: false
            api_tests: false
            cmake_args: >-
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=aarch64
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
              -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu
              -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER
              -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY
              -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY

    runs-on: ${{ matrix.os }}
    name: Native – ${{ matrix.rid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Linux x64 dependencies (X11 for the editor window, nothing else) ─
      - name: Install Linux x64 dependencies
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libx11-dev

      # ── Linux ARM64 cross-compile dependencies ────────────────────────────
      - name: Install Linux ARM64 cross-compile toolchain and sysroot
        if: matrix.rid == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          # Enable ARM64 packages from ports.ubuntu.com
          sudo dpkg --add-architecture arm64
          CODENAME=$(lsb_release -cs)
          # Write ARM64 source to a separate file so the sed below does not touch it
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main restricted universe\n' \
            "$CODENAME" | sudo tee    /etc/apt/sources.list.d/arm64.list
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s-updates main restricted universe\n' \
            "$CODENAME" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          # Restrict ALL existing sources to amd64 (handles http:// and https://)
          # Traditional one-line format (sources.list and *.list files)
          sudo sed -i '/^deb / { /\[arch=/! s/^deb /deb [arch=amd64] / }' /etc/apt/sources.list
          sudo find /etc/apt/sources.list.d -name '*.list' ! -name 'arm64.list' \
            -exec sudo sed -i '/^deb / { /\[arch=/! s/^deb /deb [arch=amd64] / }' {} \;
          # DEB822 format (*.sources files used by Ubuntu 24.04+)
          for src in /etc/apt/sources.list.d/*.sources; do
            [ -f "$src" ] || continue
            sudo awk '
              /^Architectures:/ { has_arch=1 }
              /^$/  { if (in_stanza && !has_arch) print "Architectures: amd64"
                      in_stanza=0; has_arch=0 }
              /^Types:/ { in_stanza=1 }
              { print }
              END   { if (in_stanza && !has_arch) print "Architectures: amd64" }
            ' "$src" | sudo tee "${src}.tmp" > /dev/null && sudo mv "${src}.tmp" "$src"
          done
          # Update: ignore 404 errors from sources that lack arm64 indices;
          # ports.ubuntu.com arm64 index is still fetched successfully.
          sudo apt-get update || true
          sudo apt-get install -y libx11-dev:arm64

      # ── FetchContent cache: VST3 SDK + pugixml ────────────────────────────
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: OwnVST3Native/build/_deps
          key: deps-vst3sdk-3.8.1_84-pugixml-1.15-${{ runner.os }}-${{ matrix.rid }}
          restore-keys: |
            deps-vst3sdk-3.8.1_84-pugixml-1.15-${{ runner.os }}-

      # ── CMake configure ───────────────────────────────────────────────────
      - name: Configure CMake
        shell: bash
        run: >-
          cmake -S OwnVST3Native -B OwnVST3Native/build
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DOWNVST3_BUILD_TESTS=${{ matrix.native_tests && 'ON' || 'OFF' }}
          ${{ matrix.cmake_args }}

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build
        shell: bash
        run: cmake --build OwnVST3Native/build --config ${{ env.BUILD_TYPE }} --parallel

      # ── Native unit tests (state codec, cache XML, MIDI mapping …) ────────
      - name: Native unit tests
        if: matrix.native_tests
        shell: bash
        run: ctest --test-dir OwnVST3Native/build -C ${{ env.BUILD_TYPE }} --output-on-failure

      # ── Collect artifact (Windows) ────────────────────────────────────────
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lib = Get-ChildItem -Path "OwnVST3Native/build" -Recurse `
            -Filter "${{ matrix.lib_name }}" | Where-Object { $_.FullName -notmatch '_deps' } | Select-Object -First 1
          if ($lib) {
            New-Item -ItemType Directory -Force -Path "artifacts/${{ matrix.rid }}"
            Copy-Item $lib.FullName "artifacts/${{ matrix.rid }}/${{ matrix.lib_name }}"
          } else {
            Write-Error "Library not found: ${{ matrix.lib_name }}"
            exit 1
          }

      # ── Collect artifact (Unix) ───────────────────────────────────────────
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts/${{ matrix.rid }}
          cp OwnVST3Native/build/${{ matrix.lib_name }} artifacts/${{ matrix.rid }}/

      # ── The licence promise: no JUCE in what we ship ──────────────────────
      - name: Check binary is JUCE-free
        shell: bash
        run: |
          if grep -a -i -q juce "artifacts/${{ matrix.rid }}/${{ matrix.lib_name }}"; then
            echo "::error::JUCE found in ${{ matrix.lib_name }}"
            exit 1
          fi

      # ── VST3 SDK sample plugins the API tests load (MIT, built here) ──────
      - name: Build test plugins
        if: matrix.api_tests
        shell: bash
        run: |
          ARCH_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then ARCH_ARGS="-A x64"; fi
          cmake -S OwnVST3Native/build/_deps/vst3sdk-src -B OwnVST3Native/build-plugins $ARCH_ARGS \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
            -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF \
            -DSMTG_RUN_VST_VALIDATOR=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build OwnVST3Native/build-plugins --config ${{ env.BUILD_TYPE }} --parallel \
            --target adelay again-sample-accurate mda-vst3 sync-delay legacy-midicc-out utf16-name

      - name: Setup .NET
        if: matrix.api_tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # ── C# API tests: exports, golden files, VST3 / AU behaviour, scanner ─
      - name: API tests
        if: matrix.api_tests
        shell: bash
        env:
          OWNVST3_NATIVE_LIB: ${{ github.workspace }}/artifacts/${{ matrix.rid }}/${{ matrix.lib_name }}
          OWNVST3_TEST_PLUGINS: ${{ github.workspace }}/OwnVST3Native/build-plugins/VST3/${{ env.BUILD_TYPE }}
        run: dotnet test OwnVST3Tests/OwnVST3Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/
          retention-days: 30

  # ============================================================
  # Commit built libraries back into the repository
  # ============================================================
  update-native-libs:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: build-native
    runs-on: ubuntu-latest
    name: Update Native Libraries
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref:   ${{ github.ref }}

      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: runtimes/win-x64/native/

      - name: Download Windows x86
        uses: actions/download-artifact@v4
        with:
          name: native-win-x86
          path: runtimes/win-x86/native/
        continue-on-error: true

      - name: Download Windows ARM64
        uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: runtimes/win-arm64/native/
        continue-on-error: true

      - name: Download macOS universal
        uses: actions/download-artifact@v4
        with:
          name: native-osx-universal
          path: runtimes/osx/native/

      - name: Download Linux x64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native/

      - name: Download Linux ARM64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: runtimes/linux-arm64/native/
        continue-on-error: true

      - name: Replicate macOS universal to per-arch folders
        run: |
          mkdir -p runtimes/osx-x64/native runtimes/osx-arm64/native
          cp runtimes/osx/native/* runtimes/osx-x64/native/  || true
          cp runtimes/osx/native/* runtimes/osx-arm64/native/ || true

      - name: Commit updated native libraries
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runtimes/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update native libraries [skip ci]"
            git push
          fi

  # ============================================================
  # Build the C# project and pack the NuGet package
  # ============================================================
  build-csharp:
    needs: [build-native, update-native-libs]
    if: always() && needs.build-native.result == 'success'
    runs-on: ubuntu-latest
    name: C# Build & Package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull latest native libraries
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: git pull origin ${{ github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download Windows x64
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64
          path: runtimes/win-x64/native/

      - name: Download Windows x86
        uses: actions/download-artifact@v4
        with:
          name: native-win-x86
          path: runtimes/win-x86/native/
        continue-on-error: true

      - name: Download Windows ARM64
        uses: actions/download-artifact@v4
        with:
          name: native-win-arm64
          path: runtimes/win-arm64/native/
        continue-on-error: true

      - name: Download macOS universal
        uses: actions/download-artifact@v4
        with:
          name: native-osx-universal
          path: runtimes/osx/native/

      - name: Download Linux x64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: runtimes/linux-x64/native/

      - name: Download Linux ARM64
        uses: actions/download-artifact@v4
        with:
          name: native-linux-arm64
          path: runtimes/linux-arm64/native/
        continue-on-error: true

      - name: Replicate macOS universal to per-arch folders
        run: |
          mkdir -p runtimes/osx-x64/native runtimes/osx-arm64/native
          cp runtimes/osx/native/* runtimes/osx-x64/native/  || true
          cp runtimes/osx/native/* runtimes/osx-arm64/native/ || true

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack NuGet
        working-directory: OwnVST3Host
        run: dotnet pack --configuration Release --no-build -o ../packages
        continue-on-error: true

      - name: Upload C# artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OwnVST3Sharp-Release
          path: |
            bin/Release/
            OwnVST3Host/bin/Release/
            packages/
          retention-days: 30

  # ============================================================
  # Create GitHub Release on version tags
  # ============================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native, build-csharp]
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create release archives
        run: |
          cd release-artifacts
          mkdir -p native-all/runtimes
          for dir in native-*/; do
            rid=$(echo "$dir" | sed 's/native-//' | sed 's/\///')
            mkdir -p "native-all/runtimes/$rid/native"
            cp -r "$dir"* "native-all/runtimes/$rid/native/" || true
          done
          cd native-all && zip -r ../OwnVST3-native-all.zip . && cd ..
          cd OwnVST3Sharp-Release && zip -r ../OwnVST3Sharp-Release.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/OwnVST3-native-all.zip
            release-artifacts/OwnVST3Sharp-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
